name: Build DayBook Windows installers
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable DayBook source commit SHA
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: daybook-windows-release
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ secrets.DAYBOOK_SOURCE_TOKEN }}
          REQUESTED_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/Maxhm007/DayBook/releases --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("desktop-v")))] | .[0].tag_name // empty')
            if [ -z "$ref" ]; then echo 'build=false' >> "$GITHUB_OUTPUT"; exit 0; fi
            published=$(gh release view "$ref" -R Maxhm007/DayBook-Releases --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$published" = 'false' ]; then echo 'build=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          sha=$(gh api "repos/Maxhm007/DayBook/commits/$ref" --jq .sha)
          version=$(gh api "repos/Maxhm007/DayBook/contents/desktop/package.json?ref=$sha" --jq .content | base64 --decode | jq -r .version)
          tag="desktop-v$version"
          if [[ "$ref" == desktop-v* && "$ref" != "$tag" ]]; then echo 'Source tag does not match package version' >&2; exit 1; fi
          published=$(gh release view "$tag" -R Maxhm007/DayBook-Releases --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$published" = 'false' ]; then echo 'Version already published; bump the desktop version for a new release.'; echo 'build=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "source_ref=$sha" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"
  windows:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: Maxhm007/DayBook
          ref: ${{ needs.resolve.outputs.source_ref }}
          token: ${{ secrets.DAYBOOK_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: source/desktop/src-tauri -> target
          cache-on-failure: true
      - run: npm ci
        working-directory: source
      - run: npm test -- --maxWorkers=1
        working-directory: source
      - name: Typecheck gateway modules
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/lib/desktop-auth.ts src/lib/desktop-sync.ts
        working-directory: source
      - run: npm ci
        working-directory: source/desktop
      - run: npm test
        working-directory: source/desktop
      - run: npm run build
        working-directory: source/desktop
      - run: cargo test --locked --manifest-path source/desktop/src-tauri/Cargo.toml
      - name: Build signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: source/desktop
          tagName: desktop-v__VERSION__
          releaseCommitish: main
          releaseName: DayBook __VERSION__ for Windows
          releaseBody: |
            Offline Windows journal, Google sign-in/sync connector, and signed automatic updates.
            Source revision: ${{ needs.resolve.outputs.source_ref }}.
            Google cloud features require configured Desktop OAuth credentials and a deployed DayBook sync gateway. Live Google login/two-device sync and clean-machine upgrades are not yet qualified.
            Installers have updater signatures; no Windows Authenticode certificate is configured.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
      - name: Validate and publish installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content source/desktop/package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $release = gh release view $tag -R Maxhm007/DayBook-Releases --json assets | ConvertFrom-Json
          foreach ($pattern in @('*.exe','*.msi','*.sig','latest.json')) {
            if (-not ($release.assets.name -like $pattern)) { throw "Missing asset $pattern" }
          }
          $manifestDir = Join-Path $env:RUNNER_TEMP 'daybook-manifest'
          gh release download $tag -R Maxhm007/DayBook-Releases -p latest.json -p '*.exe' -p '*.msi' -p '*.sig' -D $manifestDir
          node source/scripts/verify-release.mjs $manifestDir
          $manifest = Get-Content (Join-Path $manifestDir 'latest.json') | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw 'Updater manifest version mismatch' }
          $platform = $manifest.platforms.'windows-x86_64'
          if (-not $platform.signature -or -not $platform.url.StartsWith("https://github.com/Maxhm007/DayBook-Releases/releases/download/$tag/")) { throw 'Invalid Windows updater payload' }
          $bundleFiles = Get-ChildItem source/desktop/src-tauri/target/release/bundle -Recurse -File | Where-Object Extension -In '.exe','.msi'
          $bundleFiles | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(),$_.Name } | Set-Content SHA256SUMS.txt
          gh release upload $tag SHA256SUMS.txt -R Maxhm007/DayBook-Releases --clobber
          gh release edit $tag -R Maxhm007/DayBook-Releases --draft=false --latest



